<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge FCE Listening Practice (Exams 1-15)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        .audio-container {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold tracking-wide text-blue-400">FCE Listening Master (Exams 1 - 15)</h1>
        
        <div class="flex items-center gap-3">
            <label for="examSelect" class="text-sm font-medium text-slate-300">Select Exam:</label>
            <select id="examSelect" class="bg-slate-700 text-slate-100 border border-slate-600 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                <!-- Populated dynamically via JS -->
            </select>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-4xl">

        <!-- Audio Player Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 mb-6 shadow-lg">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-3">
                <div>
                    <h2 id="currentExamTitle" class="text-lg font-semibold text-white">Exam 1</h2>
                    <p class="text-xs text-slate-400">Audio playback powered by official source</p>
                </div>
                
                <!-- Player Controls -->
                <div class="flex items-center gap-3">
                    <button id="skipBackward" title="Backward 10s" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg transition text-xs font-semibold flex items-center gap-1">
                        <span>-10s</span>
                    </button>
                    
                    <button id="playPauseBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold transition shadow">
                        Play
                    </button>
                    
                    <button id="skipForward" title="Forward 10s" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg transition text-xs font-semibold flex items-center gap-1">
                        <span>+10s</span>
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="flex items-center gap-3">
                <span id="currentTime" class="text-xs text-slate-400 w-10 text-right">0:00</span>
                <input type="range" id="seekBar" value="0" min="0" max="100" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                <span id="duration" class="text-xs text-slate-400 w-10">0:00</span>
            </div>

            <!-- Hidden YouTube Player Container -->
            <div class="audio-container">
                <div id="youtube-player"></div>
            </div>
        </div>

        <!-- Exam Content Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg mb-8">
            <div id="examContentContainer" class="space-y-8">
                <!-- Exam content injected dynamically -->
            </div>

            <!-- Global / Part Actions -->
            <div class="mt-8 pt-6 border-t border-slate-700 flex flex-wrap justify-between items-center gap-4">
                <button id="checkAnswersBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-md w-full sm:w-auto">
                    Check Answers
                </button>
                <div id="scoreSummary" class="text-lg font-semibold text-slate-200"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Cambridge B2 First (FCE) Listening Interactive Practice Platform
    </footer>

    <!-- Application Script -->
    <script>
        const examsData = [
            {
                id: 1,
                title: "Exam 1",
                youtubeUrl: "https://www.youtube.com/watch?v=lm8DXZi20Ww",
                parts: {
                    part1: {
                        title: "Part 1: Multiple Choice (Questions 1-8)",
                        questions: [
                            { id: 1, text: "1. You will hear a man talking about a course. What does he say about it?", options: { A: "Business Administration", B: "aeronautical engineering", C: "Western Europe" }, answer: "C" },
                            { id: 2, text: "2. You hear a woman talking about her qualifications.", options: { A: "Private Pilot’s Licence", B: "across the Sahara", C: "over the Alps" }, answer: "B" },
                            { id: 3, text: "3. You hear a man talking about a business project.", options: { A: "Zanussi", B: "balloon manufacturing capital", C: "the highest level" }, answer: "A" },
                            { id: 4, text: "4. You hear someone talking about a journey.", options: { A: "degree", B: "degree program", C: "professional training" }, answer: "B" },
                            { id: 5, text: "5. You hear a person discussing an achievement.", options: { A: "First position", B: "Runner up", C: "Third place" }, answer: "A" },
                            { id: 6, text: "6. You hear a speaker discussing a technical failure.", options: { A: "Engine failure", B: "Fuel leak", C: "Electrical issue" }, answer: "A" },
                            { id: 7, text: "7. You hear a review of a project.", options: { A: "Too costly", B: "Too slow", C: "Successful" }, answer: "C" },
                            { id: 8, text: "8. You hear a person explaining future plans.", options: { A: "Traveling abroad", B: "Starting a business", C: "Studying further" }, answer: "B" }
                        ]
                    },
                    part2: {
                        title: "Part 2: Sentence Completion (Questions 9-18)",
                        questions: [
                            { id: 9, text: "9. Business Administration", answer: "Business Administration" },
                            { id: 10, text: "10. aeronautical engineering", answer: "aeronautical engineering" },
                            { id: 11, text: "11. Western Europe", answer: "Western Europe" },
                            { id: 12, text: "12. Private Pilot’s Licence", answer: "Private Pilot’s Licence" },
                            { id: 13, text: "13. across the Sahara", answer: "across the Sahara" },
                            { id: 14, text: "14. over the Alps", answer: "over the Alps" },
                            { id: 15, text: "15. Zanussi", answer: "Zanussi" },
                            { id: 16, text: "16. balloon manufacturing capital", answer: "balloon manufacturing capital" },
                            { id: 17, text: "17. the highest level", answer: "the highest level" },
                            { id: 18, text: "18. degree", answer: "degree" }
                        ]
                    },
                    part3: {
                        title: "Part 3: Multiple Matching (Questions 19-23)",
                        instructions: "Choose from the list (A-H) what each speaker says. Use the letters only once.",
                        options: { A: "I accept responsibility.", B: "I wouldn't want to earn less.", C: "I was motivated by money.", D: "I don't intend to pay back.", E: "Lack of money ruined my relationship.", F: "I may have no moral conscience.", G: "I never had money for long.", H: "Money affected my health." },
                        questions: [
                            { id: 19, text: "Speaker 1", answer: "D" },
                            { id: 20, text: "Speaker 2", answer: "E" },
                            { id: 21, text: "Speaker 3", answer: "A" },
                            { id: 22, text: "Speaker 4", answer: "F" },
                            { id: 23, text: "Speaker 5", answer: "C" }
                        ]
                    },
                    part4: {
                        title: "Part 4: Multiple Choice (Questions 24-30)",
                        questions: [
                            { id: 24, text: "24. What are the parents worried about?", options: { A: "Not enough friends", B: "Too much time online", C: "Going out too often" }, answer: "B" },
                            { id: 25, text: "25. When does James talk to virtual friends most?", options: { A: "Going to college", B: "Waking up", C: "When not at college" }, answer: "B" },
                            { id: 26, text: "26. What is James' opinion of his behavior?", options: { A: "Not unusual", B: "Antisocial", C: "Needs change" }, answer: "A" },
                            { id: 27, text: "27. What generalization does James make about adults?", options: { A: "Don't understand youth", B: "Too serious", C: "Always busy" }, answer: "B" },
                            { id: 28, text: "28. What does Evan the psychologist think?", options: { A: "Supports parents", B: "Sympathizes", C: "Understands both" }, answer: "C" },
                            { id: 29, text: "29. What does Joanne suggest?", options: { A: "Professional treatment", B: "New sports", C: "Gradually reduce time" }, answer: "C" },
                            { id: 30, text: "30. On what does Liz base her advice?", options: { A: "Professional experience", B: "One of her children", C: "Other teenagers" }, answer: "C" }
                        ]
                    }
                }
            }
        };

        // Populate Exams 2 through 15 dynamically based on standard structure
        const sampleUrls = [
            "https://www.youtube.com/watch?v=IFZRbfPLKj4",
            "https://www.youtube.com/watch?v=_qMwOgvQZQA",
            "https://www.youtube.com/watch?v=d91O5LRMGyQ",
            "https://www.youtube.com/watch?v=S2jS2rF-rKs",
            "https://www.youtube.com/watch?v=Ph0Mn9ofNao",
            "https://www.youtube.com/watch?v=XwW6SQM4bbU",
            "https://www.youtube.com/watch?v=5f7KFZuQ0Sk",
            "https://www.youtube.com/watch?v=T-zy0nX7MRc",
            "https://www.youtube.com/watch?v=V5pv-Ka0EBk",
            "https://www.youtube.com/watch?v=gzgQX6NLhKw",
            "https://www.youtube.com/watch?v=WItH-G57Ivc",
            "https://www.youtube.com/watch?v=toW1pLaaBXs",
            "https://www.youtube.com/watch?v=mxgXmQvKY9M",
            "https://www.youtube.com/watch?v=0EpGMHJvuGs"
        ];

        for (let i = 2; i <= 15; i++) {
            examsData.push({
                id: i,
                title: `Exam ${i}`,
                youtubeUrl: sampleUrls[i - 2] || "https://www.youtube.com/watch?v=lm8DXZi20Ww",
                parts: {
                    part1: {
                        title: "Part 1: Multiple Choice (Questions 1-8)",
                        questions: Array.from({length: 8}, (_, index) => ({
                            id: index + 1,
                            text: `${index + 1}. Listening comprehension question ${index + 1} for Exam ${i}.`,
                            options: { A: "Option A", B: "Option B", C: "Option C" },
                            answer: ["A", "B", "C"][index % 3]
                        }))
                    },
                    part2: {
                        title: "Part 2: Sentence Completion (Questions 9-18)",
                        questions: Array.from({length: 10}, (_, index) => ({
                            id: index + 9,
                            text: `${index + 9}. Complete sentence keyword ${index + 9}`,
                            answer: `answer${index + 9}`
                        }))
                    },
                    part3: {
                        title: "Part 3: Multiple Matching (Questions 19-23)",
                        instructions: "Choose from the list (A-H) what each speaker says.",
                        options: { A: "Option A", B: "Option B", C: "Option C", D: "Option D", E: "Option E", F: "Option F", G: "Option G", H: "Option H" },
                        questions: Array.from({length: 5}, (_, index) => ({
                            id: index + 19,
                            text: `Speaker ${index + 1}`,
                            answer: ["D", "E", "A", "F", "C"][index]
                        }))
                    },
                    part4: {
                        title: "Part 4: Multiple Choice (Questions 24-30)",
                        questions: Array.from({length: 7}, (_, index) => ({
                            id: index + 24,
                            text: `${index + 24}. Interview question ${index + 24}`,
                            options: { A: "Choice A", B: "Choice B", C: "Choice C" },
                            answer: ["B", "A", "C"][index % 3]
                        }))
                    }
                }
            });
        }

        let currentExamId = 1;
        let player = null;
        let isPlaying = false;
        let progressInterval = null;
        let userAnswers = {};
        let validatedExams = {};

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: extractVideoId(examsData[0].youtubeUrl),
                playerVars: { 'playsinline': 1 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : 'lm8DXZi20Ww';
        }

        function onPlayerReady(event) {
            updateDurationDisplay();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').innerText = 'Pause';
                startProgressTracker();
            } else {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerText = 'Play';
                stopProgressTracker();
            }
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration() || 1;
                    document.getElementById('seekBar').value = (current / duration) * 100;
                    document.getElementById('currentTime').innerText = formatTime(current);
                }
            }, 500);
        }

        function stopProgressTracker() {
            clearInterval(progressInterval);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateDurationDisplay() {
            setTimeout(() => {
                if (player && player.getDuration) {
                    document.getElementById('duration').innerText = formatTime(player.getDuration());
                }
            }, 1000);
        }

        // Render Exam Selector options
        const examSelect = document.getElementById('examSelect');
        examsData.forEach(exam => {
            const opt = document.createElement('option');
            opt.value = exam.id;
            opt.innerText = exam.title;
            examSelect.appendChild(opt);
        });

        examSelect.addEventListener('change', (e) => {
            const newExamId = parseInt(e.target.value);
            
            // Check if current exam has answers entered but not validated
            const hasUnvalidatedAnswers = Object.keys(userAnswers).some(k => k.startsWith(`exam_${currentExamId}_`) && userAnswers[k] !== '');
            const isValidated = validatedExams[currentExamId];

            if (hasUnvalidatedAnswers && !isValidated) {
                const confirmSwitch = confirm("You have unvalidated answers in this exam. Are you sure you want to switch exams without validating?");
                if (!confirmSwitch) {
                    examSelect.value = currentExamId;
                    return;
                }
            }

            currentExamId = newExamId;
            loadExam(currentExamId);
        });

        function loadExam(id) {
            const exam = examsData.find(e => e.id === id);
            document.getElementById('currentExamTitle').innerText = exam.title;
            
            if (player && player.loadVideoById) {
                player.loadVideoById(extractVideoId(exam.youtubeUrl));
            }

            renderExamContent(exam);
        }

        function renderExamContent(exam) {
            const container = document.getElementById('examContentContainer');
            container.innerHTML = '';
            document.getElementById('scoreSummary').innerText = '';

            for (const [partKey, partData] of Object.entries(exam.parts)) {
                const partDiv = document.createElement('div');
                partDiv.className = "border-b border-slate-700 pb-6 mb-6 last:border-b-0 last:pb-0 last:mb-0";
                
                let html = `<h3 class="text-lg font-bold text-blue-400 mb-3">${partData.title}</h3>`;
                if (partData.instructions) {
                    html += `<p class="text-sm text-slate-400 mb-4">${partData.instructions}</p>`;
                }

                if (partData.options) {
                    html += `<div class="bg-slate-700/50 p-4 rounded-lg mb-4 text-sm grid grid-cols-1 sm:grid-cols-2 gap-2">`;
                    for (const [optKey, optVal] of Object.entries(partData.options)) {
                        html += `<div><strong class="text-blue-300">${optKey}:</strong> ${optVal}</div>`;
                    }
                    html += `</div>`;
                }

                partData.questions.forEach(q => {
                    const storageKey = `exam_${exam.id}_q_${q.id}`;
                    const savedVal = userAnswers[storageKey] || '';

                    html += `<div class="mb-4 bg-slate-900/40 p-3 rounded-lg border border-slate-700/50">`;
                    html += `<p class="text-sm font-medium text-slate-200 mb-2">${q.text}</p>`;

                    if (q.options) {
                        html += `<div class="space-y-1.5">`;
                        for (const [optKey, optText] of Object.entries(q.options)) {
                            const checked = savedVal === optKey ? 'checked' : '';
                            html += `<label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
                                <input type="radio" name="q_${q.id}" value="${optKey}" ${checked} onchange="saveAnswer(${exam.id}, ${q.id}, '${optKey}')" class="text-blue-500 focus:ring-blue-400">
                                <span><strong>${optKey})</strong> ${optText}</span>
                            </label>`;
                        }
                        html += `</div>`;
                    } else {
                        html += `<input type="text" value="${savedVal}" oninput="saveAnswer(${exam.id}, ${q.id}, this.value.trim())" placeholder="Type your answer here..." class="bg-slate-700 border border-slate-600 rounded px-3 py-1 text-sm text-white w-full max-w-md focus:outline-none focus:ring-1 focus:ring-blue-500">`;
                    }

                    html += `<div id="feedback_${q.id}" class="text-xs mt-1 font-semibold"></div>`;
                    html += `</div>`;
                });

                partDiv.innerHTML = html;
                container.appendChild(partDiv);
            }
        }

        window.saveAnswer = function(examId, qId, val) {
            userAnswers[`exam_${examId}_q_${qId}`] = val;
        }

        // Audio controls listeners
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('skipBackward').addEventListener('click', () => {
            if (player && player.getCurrentTime) {
                player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
            }
        });

        document.getElementById('skipForward').addEventListener('click', () => {
            if (player && player.getCurrentTime) {
                player.seekTo(Math.min(player.getDuration(), player.getCurrentTime() + 10), true);
            }
        });

        document.getElementById('seekBar').addEventListener('input', (e) => {
            if (player && player.getDuration) {
                const seekToTime = (e.target.value / 100) * player.getDuration();
                player.seekTo(seekToTime, true);
            }
        });

        // Grading logic (works for any part or full exam)
        document.getElementById('checkAnswersBtn').addEventListener('click', () => {
            const currentExam = examsData.find(e => e.id === currentExamId);
            let correctCount = 0;
            let totalQuestions = 0;

            for (const partData of Object.values(currentExam.parts)) {
                partData.questions.forEach(q => {
                    totalQuestions++;
                    const storageKey = `exam_${currentExam.id}_q_${q.id}`;
                    const userAns = (userAnswers[storageKey] || '').toLowerCase();
                    const correctAns = q.answer.toLowerCase();
                    
                    const feedbackEl = document.getElementById(`feedback_${q.id}`);
                    if (!feedbackEl) return;

                    if (userAns === '') {
                        feedbackEl.innerText = `Not answered. Correct: ${q.answer}`;
                        feedbackEl.className = "text-xs mt-1 font-semibold text-amber-400";
                    } else if (userAns === correctAns) {
                        correctCount++;
                        feedbackEl.innerText = `Correct!`;
                        feedbackEl.className = "text-xs mt-1 font-semibold text-emerald-400";
                    } else {
                        feedbackEl.innerText = `Incorrect. Correct: ${q.answer}`;
                        feedbackEl.className = "text-xs mt-1 font-semibold text-rose-400";
                    }
                });
            }

            validatedExams[currentExamId] = true;
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            document.getElementById('scoreSummary').innerText = `Score: ${correctCount} / ${totalQuestions} (${percentage}%)`;
        });

        // Initial Load
        loadExam(1);
    </script>
</body>
</html>
